<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Edeviser — Attendance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','sans-serif']}}}}</script>
<link rel="stylesheet" href="shared.css"/>
<style>
  /* Teacher Attendance — maps to: class_sessions, attendance_records, useAttendance.
     Mark present/late/absent per student for a session; roll-up rate per student. */
  html.mode-laptop body[data-norail] .page-content{max-width:none;padding-right:32px}
  .at-grid{display:block}
  html.mode-laptop .at-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
  html.mode-laptop .at-rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:16px}
  .seg-at{display:inline-flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:2px}
  .seg-at button{font-size:12px;font-weight:800;color:#64748b;padding:5px 12px;border-radius:7px;cursor:pointer}
  .seg-at button.p{}.seg-at button.on.p{background:#22c55e;color:#fff}
  .seg-at button.on.l{background:#f59e0b;color:#fff}
  .seg-at button.on.a{background:#ef4444;color:#fff}
</style>
</head>
<body class="bg-slate-50" data-role="teacher" data-norail>

<header class="app-header">
  <div class="flex items-center gap-3">
    <a href="teacher-dashboard.html" class="p-1.5 rounded-lg hover:bg-gray-100"><svg class="h-5 w-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg></a>
    <div><h1 class="text-base font-bold tracking-tight text-gray-900">Attendance</h1><p class="text-xs text-gray-500">CS301 · Lecture · Tue Jul 7, 9:00</p></div>
  </div>
  <button class="btn3d sm" onclick="toast('Attendance saved','✅')" style="background:#0382bd">Save attendance</button>
</header>

<div class="page-content no-scrollbar">
  <div class="at-grid">
    <div class="space-y-4">

      <!-- Session picker + bulk -->
      <div class="pcard p-4 flex items-center gap-3 flex-wrap">
        <select class="text-sm border border-gray-200 rounded-lg px-2.5 py-2 bg-white"><option>Tue Jul 7 · Lecture · 9:00</option><option>Mon Jul 6 · Lab · 11:00</option><option>Thu Jul 2 · Lecture · 9:00</option></select>
        <span class="text-xs text-gray-500 flex-1">5 students</span>
        <button class="btn3d sm b-ghost" onclick="allPresent()">Mark all present</button>
      </div>

      <!-- Roster (attendance_records) -->
      <div class="pcard p-4">
        <div class="sec-h"><span class="chip">🗓️</span><p class="t">Roster</p></div>
        <div class="divide-y divide-gray-50" id="roster">
          <!-- rows rendered by JS -->
        </div>
      </div>

    </div>

    <aside class="at-rail">
      <!-- Today's summary -->
      <div class="pcard p-4">
        <div class="sec-h"><span class="chip">📊</span><p class="t">This session</p></div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="stat-tile"><p class="st-v text-green-600" id="c-present">5</p><p class="st-k">Present</p></div>
          <div class="stat-tile"><p class="st-v text-amber-600" id="c-late">0</p><p class="st-k">Late</p></div>
          <div class="stat-tile"><p class="st-v text-red-600" id="c-absent">0</p><p class="st-k">Absent</p></div>
        </div>
      </div>
      <!-- Attendance rate per student (roll-up) -->
      <div class="pcard p-4">
        <div class="sec-h"><span class="chip">📈</span><p class="t">Term attendance</p></div>
        <div class="space-y-2.5">
          <div><div class="flex justify-between text-xs font-bold mb-1"><span class="text-gray-700">Maryam K.</span><span class="text-green-600">98%</span></div><div class="emeter strong"><span style="width:98%"></span></div></div>
          <div><div class="flex justify-between text-xs font-bold mb-1"><span class="text-gray-700">Sarah A.</span><span class="text-green-600">92%</span></div><div class="emeter good"><span style="width:92%"></span></div></div>
          <div><div class="flex justify-between text-xs font-bold mb-1"><span class="text-gray-700">Omar Z.</span><span class="text-amber-600">74%</span></div><div class="emeter attention"><span style="width:74%"></span></div></div>
          <div><div class="flex justify-between text-xs font-bold mb-1"><span class="text-gray-700">Nora S.</span><span class="text-red-600">61%</span></div><div class="emeter critical"><span style="width:61%"></span></div></div>
        </div>
        <p class="text-[11px] text-gray-400 mt-2">Low attendance feeds the at-risk signal.</p>
      </div>
    </aside>
  </div>
</div>

<nav class="bottom-bar">
  <a href="teacher-dashboard.html" class="tab-btn" data-tab="home"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125h14.25c.621 0 1.125-.504 1.125-1.125V9.75"/></svg><span>Home</span></a>
  <a href="teacher-students.html" class="tab-btn" data-tab="students"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Z"/></svg><span>Students</span></a>
  <a href="teacher-attendance.html" class="tab-btn active" data-tab="attendance"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg><span>Attendance</span></a>
  <a href="teacher-curriculum.html" class="tab-btn" data-tab="curriculum"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"/></svg><span>Curriculum</span></a>
  <a href="teacher-grading.html" class="tab-btn" data-tab="grading"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Z"/></svg><span>Grading</span></a>
</nav>
<script src="shared.js"></script>
<script>
  const STU=['Maryam K.','Sarah A.','Omar Z.','Layla H.','Nora S.'];
  const state=STU.map(()=> 'p');
  function render(){
    document.getElementById('roster').innerHTML=STU.map((n,idx)=>{
      const s=state[idx];
      return `<div class="flex items-center gap-3 py-2.5"><div class="h-9 w-9 rounded-full bg-slate-200 flex items-center justify-center text-sm font-bold text-slate-600 shrink-0">${n[0]}</div><span class="flex-1 text-sm font-semibold text-gray-900">${n}</span><div class="seg-at"><button class="p ${s==='p'?'on':''}" onclick="mark(${idx},'p')">Present</button><button class="l ${s==='l'?'on':''}" onclick="mark(${idx},'l')">Late</button><button class="a ${s==='a'?'on':''}" onclick="mark(${idx},'a')">Absent</button></div></div>`;
    }).join('');
    document.getElementById('c-present').textContent=state.filter(x=>x==='p').length;
    document.getElementById('c-late').textContent=state.filter(x=>x==='l').length;
    document.getElementById('c-absent').textContent=state.filter(x=>x==='a').length;
  }
  function mark(i,v){ state[i]=v; render(); }
  function allPresent(){ state.fill('p'); render(); toast('All marked present','✅'); }
  render();
</script>
</body>
</html>
