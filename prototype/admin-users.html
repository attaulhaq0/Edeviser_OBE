<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Edeviser — People</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','sans-serif']}}}}</script>
<link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-slate-50" data-role="admin">
<header class="app-header">
  <div class="hdr-brand flex items-center gap-2"><div class="h-7 w-7 rounded-lg flex items-center justify-center" style="background:var(--brand-gradient)"><span class="text-white text-sm">✦</span></div><span class="text-base font-bold tracking-tight text-gray-900">Edeviser</span></div>
  <div class="flex items-center gap-2"><a href="admin-profile.html" class="h-8 w-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:var(--brand-gradient)">G</a></div>
</header>
<div class="page-content space-y-4 no-scrollbar">

  <div class="feed-wide flex items-center justify-between gap-3">
    <div><h1 class="text-xl font-black tracking-tight text-gray-900">People</h1><p class="text-xs text-gray-500 mt-0.5">Roles, access &amp; onboarding across Gulf Academy.</p></div>
    <button onclick="toast('Invite dialog opened','✉️')" class="text-sm font-bold text-white px-4 py-2 rounded-xl shrink-0" style="background:var(--brand-gradient)">+ Invite</button>
  </div>

  <div class="feed-wide grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="pcard p-3.5"><p class="text-[10px] font-black tracking-widest uppercase text-gray-400">Students</p><p class="text-2xl font-black text-gray-900 mt-0.5">1,240</p></div>
    <div class="pcard p-3.5"><p class="text-[10px] font-black tracking-widest uppercase text-gray-400">Teachers</p><p class="text-2xl font-black text-gray-900 mt-0.5">86</p></div>
    <div class="pcard p-3.5"><p class="text-[10px] font-black tracking-widest uppercase text-gray-400">Coordinators</p><p class="text-2xl font-black text-gray-900 mt-0.5">9</p></div>
    <div class="pcard p-3.5"><p class="text-[10px] font-black tracking-widest uppercase text-gray-400">Parents linked</p><p class="text-2xl font-black text-gray-900 mt-0.5">640</p></div>
  </div>

  <div class="feed-wide flex items-center gap-2 flex-wrap">
    <button class="filt on" onclick="filt(this,'all')">All</button>
    <button class="filt" onclick="filt(this,'teacher')">Teachers</button>
    <button class="filt" onclick="filt(this,'coordinator')">Coordinators</button>
    <button class="filt" onclick="filt(this,'student')">Students</button>
    <button class="filt" onclick="filt(this,'parent')">Parents</button>
  </div>

  <div class="feed-wide pcard p-0 overflow-hidden">
    <div style="overflow-x:auto"><table class="dtable" style="min-width:560px">
      <thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>

</div>
<style>.filt{font-size:12px;font-weight:700;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:7px 12px;cursor:pointer}.filt.on{background:#0f172a;color:#fff;border-color:#0f172a}</style>
<script>
const U=[
  {n:"Prof. Ahmed Al-Rashid",r:"teacher",d:"Computer Science",s:"Active"},
  {n:"Dr. Khalid Ibrahim",r:"coordinator",d:"Computer Science",s:"Active"},
  {n:"Prof. Fatima Noor",r:"teacher",d:"Engineering",s:"Active"},
  {n:"Maya Hassan",r:"student",d:"Computer Science",s:"Active"},
  {n:"Omar Haddad",r:"student",d:"Computer Science",s:"At risk"},
  {n:"Nadia Hassan",r:"parent",d:"—",s:"Active"},
  {n:"Sara Al-Mansoori",r:"student",d:"Computer Science",s:"At risk"},
  {n:"Dr. Yusuf Kamal",r:"coordinator",d:"Business",s:"Active"},
];
const rp={teacher:'pill-blue',coordinator:'pill-amber',student:'pill-green',parent:'pill-blue'};
function draw(f='all'){document.getElementById('rows').innerHTML=U.filter(u=>f==='all'||u.r===f).map(u=>`<tr><td><b style="color:#0f172a">${u.n}</b></td><td><span class="pill ${rp[u.r]}" style="text-transform:capitalize">${u.r}</span></td><td>${u.d}</td><td>${u.s==='At risk'?'<span class="pill pill-red">At risk</span>':'<span style="color:#16a34a">●</span> Active'}</td><td style="white-space:nowrap"><button onclick="viewAsUser('${u.n}')" title="See the app as this user (read-only, audited)" class="text-xs font-bold text-blue-600">View as</button><span class="text-gray-200 mx-1.5">·</span><button onclick="toast('Managing ${u.n}','⚙️')" class="text-xs font-bold text-blue-600">Manage</button></td></tr>`).join('');}
// Impersonation ("view as user") — useImpersonation/ImpersonationProvider. Real
// support capability; every session is read-only by default and written to the
// audit log. Prototype-only confirm + toast here.
function viewAsUser(name){
  if(confirm('Start a "View as" session as '+name+"?\n\nYou'll see the app exactly as they do. The session is read-only and recorded in the audit log.")){
    toast('Viewing as '+name+' · audited','👁️');
  }
}
function filt(el,f){document.querySelectorAll('.filt').forEach(b=>b.classList.remove('on'));el.classList.add('on');draw(f);}
draw();
</script>
<script src="shared.js"></script>
</body>
</html>
