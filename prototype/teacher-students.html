<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Edeviser — Students</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','sans-serif']}}}}</script>
<link rel="stylesheet" href="shared.css"/>
<link rel="stylesheet" href="teacher-refinement.css"/>
</head>
<body class="bg-slate-50" data-role="teacher">
<header class="app-header">
  <div class="hdr-brand flex items-center gap-2"><div class="h-7 w-7 rounded-lg flex items-center justify-center" style="background:var(--brand-gradient)"><span class="text-white text-sm">✦</span></div><span class="text-base font-bold tracking-tight text-gray-900">Edeviser</span></div>
  <div class="flex items-center gap-2"><a href="teacher-profile.html" class="h-8 w-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:var(--brand-gradient)">A</a></div>
</header>
<div class="page-content space-y-4 no-scrollbar">
  <!-- Prototype roster: static course, progress and outcome evidence. -->

  <div class="feed-wide flex items-center justify-between gap-3">
    <div><h1 class="text-xl font-black tracking-tight text-gray-900">Students</h1><p class="text-xs text-gray-500 mt-0.5">CS301 roster · explore course progress and outcome evidence. Prioritized action lives in Student Triage.</p></div>
  </div>

  <div class="feed-wide flex items-center gap-2 flex-wrap">
    <button class="filt on" onclick="filt(this,'all')">All · 32</button>
    <button class="filt" onclick="filt(this,'cs301')">CS301 · Database Design</button>
    <button class="filt" onclick="filt(this,'cs205')">CS205 · Web Development</button>
    <a class="filt" href="teacher-triage.html">⚠️ Open Student Triage · 3</a>
  </div>

  <div class="feed-wide pcard p-0 overflow-hidden">
    <div style="overflow-x:auto">
      <table class="dtable" style="min-width:640px">
        <thead><tr><th>Student</th><th>Course</th><th>Current outcome</th><th>CLO mastery</th><th>Course progress</th><th>Learning state</th><th>Explore</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

</div>
<style>.filt{font-size:12px;font-weight:700;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:7px 12px;cursor:pointer}.filt.on{background:#0f172a;color:#fff;border-color:#0f172a}</style>
<script>
const STU=[
  {n:"Sarah Ahmed",c:"CS301",clo:"Normalization · CLO 3",m:62,p:72,s:"Developing"},
  {n:"Omar Haddad",c:"CS301",clo:"Normalization · CLO 3",m:61,p:68,s:"Developing"},
  {n:"Aisha K.",c:"CS301",clo:"Indexing · CLO 4",m:92,p:84,s:"On track"},
  {n:"Yousef M.",c:"CS301",clo:"3NF · CLO 3",m:64,p:71,s:"Developing"},
  {n:"Lina Yusuf",c:"CS205",clo:"REST APIs · CLO 5",m:55,p:58,s:"Needs review"},
  {n:"Maryam K.",c:"CS205",clo:"REST APIs · CLO 5",m:88,p:81,s:"On track"},
  {n:"Hassan R.",c:"CS205",clo:"Testing · CLO 2",m:74,p:76,s:"On track"},
];
const mc=m=>m>=70?'#16a34a':m>=50?'#b45309':'#b91c1c';
function draw(f='all'){
  document.getElementById('rows').innerHTML=STU.filter(s=>f==='all'||s.c.toLowerCase()===f).map(s=>`
    <tr class="teacher-roster-row">
      <td><b style="color:#0f172a">${s.n}</b></td>
      <td>${s.c}</td>
      <td>${s.clo}</td>
      <td><b style="color:${mc(s.m)}">${s.m}%</b></td>
      <td>${s.p}%</td>
      <td><span class="pill ${s.s==='On track'?'pill-green':'pill-amber'}">${s.s}</span></td>
      <td>${s.n==='Sarah Ahmed'?'<a href="teacher-student-detail.html" class="text-xs font-bold text-blue-600">Open evidence →</a>':'<button onclick="toast(\'Roster evidence opened\',\'📖\')" class="text-xs font-bold text-blue-600">Explore →</button>'}</td>
    </tr>`).join('');
}
function filt(el,f){document.querySelectorAll('.filt').forEach(b=>b.classList.remove('on'));el.classList.add('on');draw(f);}
draw();
</script>
<script src="teacher-data.js"></script><script src="shared.js"></script><script src="teacher-refinement.js"></script>
</body>
</html>
