<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Initial light canvas; ThemeProvider keeps browser chrome in sync. -->
    <meta name="theme-color" content="#F3F7FB" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Edeviser — Outcome-Based Education Platform</title>
    <!-- One small critical Latin body face also serves Latin text in Arabic UI.
         Vite fingerprints this same source URL in HTML and CSS. Other subsets,
         headings, italics and reading faces stay on demand. /font-licenses.txt -->
    <link rel="preload" href="/src/assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Warm the TCP+TLS connection to the Supabase origin during initial HTML
      parse, in parallel with JS bundle download. On a cold first load the very
      first API call (auth token refresh → the dashboard aggregate RPC) would
      otherwise pay a full DNS + TCP + TLS handshake (~2-3 RTT) before any data
      moves. Pre-opening the connection removes that serial handshake from the
      critical path — the higher the client↔DB round-trip time, the bigger the
      saving. `crossorigin` is required so the anonymous CORS connection matches
      the credential-less `fetch` requests supabase-js makes (otherwise the
      browser opens a second connection and the hint is wasted). The URL is
      substituted from VITE_SUPABASE_URL at build time.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
