name: Scheduled Health Check

on:
  schedule:
    # Daily: migration and runtime drift must become loud within 24 hours.
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: read
  contents: read

jobs:
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "http://localhost:54321"
      VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-coverage
          path: coverage/
          retention-days: 30

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Full npm audit
        run: npm audit --audit-level=moderate

  supabase-infra-audit:
    name: Supabase Infrastructure Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Check live Edge Function source/deployment ownership
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: cdlgtbvxlxjpcddjazzx
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — Edge Function ownership cannot be verified"
            exit 1
          fi
          supabase functions list \
            --project-ref "$PROJECT_REF" \
            --output-format json \
            | node scripts/check-edge-function-ownership.mjs --deployed-json -

      - name: Check runtime/source deployment attestation drift
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_REF: cdlgtbvxlxjpcddjazzx
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=edge-runtime-attestation-snapshot&per_page=1" --jq '.artifacts[0].id // empty')"
          if [[ -z "$artifact_id" ]]; then
            echo "::error::No deployment attestation artifact is available; runtime/source parity is unproven"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > attestation.zip
          unzip -q attestation.zip -d attestation
          supabase functions list --project-ref "$PROJECT_REF" --output-format json > deployed-functions.json
          mkdir -p remote-source
          jq -r '.governedFunctions[]' attestation/edge-runtime-attestation.json | while read -r function_name; do
            supabase functions download "$function_name" --project-ref "$PROJECT_REF" --use-api --workdir "remote-source/$function_name"
          done
          node scripts/check-runtime-attestation-drift.mjs attestation/edge-runtime-attestation.json deployed-functions.json remote-source

      - name: Check storage bucket migrations
        run: |
          echo "=== Storage Bucket Audit ==="
          BUCKETS=$(grep -roh "storage\.from(['\"][^'\"]*['\"])" src/ 2>/dev/null | sort -u || true)
          echo "Buckets referenced in code:"
          echo "$BUCKETS"

          if ! grep -rl "storage\.buckets" supabase/migrations/ >/dev/null 2>&1; then
            echo "::warning::No storage bucket migration found — uploads will fail in production"
          fi

      - name: Check FK index coverage
        run: |
          echo "=== FK Index Coverage Audit ==="
          FK_INDEXES=$(grep -c "CREATE INDEX" supabase/migrations/*.sql 2>/dev/null || echo 0)
          echo "Total CREATE INDEX statements across migrations: $FK_INDEXES"

      - name: Check RLS policy optimization
        run: |
          echo "=== RLS Policy Optimization Audit ==="
          BARE_AUTH=$(grep -rn "= auth\.uid()" supabase/migrations/ 2>/dev/null | grep -v "(select" | wc -l || echo 0)
          OPTIMIZED=$(grep -rn "(select auth\.uid())" supabase/migrations/ 2>/dev/null | wc -l || echo 0)
          echo "Bare auth.uid() in policies: $BARE_AUTH"
          echo "Optimized (select auth.uid()) in policies: $OPTIMIZED"
          if [ "$BARE_AUTH" -gt 0 ]; then
            echo "::warning::$BARE_AUTH RLS policies still use bare auth.uid() — performance impact at scale"
          fi

      - name: Check schema drift
        run: |
          echo "=== Schema Drift Audit ==="
          # Check for any remaining 'as unknown as' casts in hooks
          CASTS=$(grep -rn "as unknown as" src/hooks/ 2>/dev/null | wc -l || echo 0)
          echo "Remaining 'as unknown as' type casts in hooks: $CASTS"
          if [ "$CASTS" -gt 0 ]; then
            echo "::warning::$CASTS hooks still bypass type checking with 'as unknown as' casts"
          fi

  sql-validation:
    name: SQL Migration Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate all SQL migrations
        run: |
          ERRORS=0
          for f in $(find supabase/migrations -name '*.sql' 2>/dev/null | sort); do
            if grep -qiP '(CREATE\s+TABEL|DRPO\s+TABLE|ATLER\s+TABLE)' "$f" 2>/dev/null; then
              echo "::error file=$f::Possible SQL typo in $f"
              ERRORS=$((ERRORS + 1))
            fi
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty migration: $f"
              ERRORS=$((ERRORS + 1))
            fi
            OPEN=$(grep -o '(' "$f" | wc -l)
            CLOSE=$(grep -o ')' "$f" | wc -l)
            if [ "$OPEN" -ne "$CLOSE" ]; then
              echo "::warning file=$f::Unbalanced parens in $f"
            fi
          done
          echo "Validated $(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l) migrations"
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

  branch-migration-health:
    name: Supabase Branch Migration Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Alert if any Supabase branch is in MIGRATIONS_FAILED
        # Safety net for the failure mode that silently stranded weeks of merged
        # migrations: if Supabase Branching's production branch enters
        # MIGRATIONS_FAILED it stops applying ALL later migrations with no alert.
        # This scheduled probe turns that silent halt into a loud, visible failure.
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — migration health cannot be verified"
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/branches")"
          echo "Supabase branch API HTTP status: $http_status"
          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Supabase branch health lookup failed (HTTP $http_status)"
            exit 1
          fi
          branch_count="$(jq 'length' "$response_file")"
          echo "Supabase branch count: $branch_count"
          jq -r '.[] | "Branch: \(.name // .git_branch // "unknown") status=\(.status // "unknown")"' "$response_file"
          failed_branches="$(jq -r '[.[] | select(.status == "MIGRATIONS_FAILED") | (.name // .git_branch // "unknown")] | join(", ")' "$response_file")"
          if [[ -n "$failed_branches" ]]; then
            echo "::error::A Supabase branch is in MIGRATIONS_FAILED — production migrations are NOT deploying. Clear it in Dashboard → Branches and check the deploy-migrations workflow."
            echo "Failed branch names: $failed_branches"
            exit 1
          fi
          echo "All Supabase branches healthy (no MIGRATIONS_FAILED)."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: cdlgtbvxlxjpcddjazzx

      - name: Verify Production migration ledger equals repository head
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: cdlgtbvxlxjpcddjazzx
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN not set — migration ledger cannot be verified"; exit 1; }
          supabase migration list --project-ref "$PROJECT_REF" --output json > remote-migrations.json
          node scripts/check-migration-ledger.mjs remote-migrations.json
