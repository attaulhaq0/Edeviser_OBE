name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Branch protection (Req 21.3–21.6 — document only; not settable from code)
#
# The following required status checks MUST be green before a pull request can
# merge to `main`. Configure these as "Required status checks" in
# GitHub → Settings → Branches → Branch protection rule for `main`:
#
#   - lint           (ESLint, zero warnings)
#   - typecheck      (tsc --noEmit)
#   - test           (Vitest unit + property; C1 Static_Cast_Guard and
#                     C2 Schema_Contract_Test ride along here — Req 21.1)
#   - sql-lint       (replay-order integrity + C4 Declared_Object_Check — Req 21.1)
#   - rls-smoke      (C3 RLS_Smoke_Test vs Supabase preview branch — Req 21.2)
#   - Supabase Preview (Supabase Branching — clean from-scratch migration replay)
#
# This mirrors the local pre-push gate (lint → tsc → vitest, see
# .kiro/steering/pre-push-checks.md). A red required check blocks the merge
# (Req 21.3, 21.6); an all-green run reports a mergeable pipeline (Req 21.5).
# These checks run on every pull request targeting `main` (Req 21.4) via the
# `on.pull_request` trigger above.
# ---------------------------------------------------------------------------

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Guard docs PDF Git attributes
        run: node scripts/check-docs-pdf-lfs.mjs

      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Test
    # Part C: the C1 Static_Cast_Guard (src/__tests__/unit/supabaseCastGuard.test.ts)
    # and C2 Schema_Contract_Test (src/__tests__/unit/schemaContract.test.ts) are plain
    # Vitest files needing no secrets, so they ride this job automatically via the
    # default include glob in vite.config.ts (Req 21.1). The RLS integration smoke
    # suite is excluded here and runs in the dedicated `rls-smoke` job below.
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  prototype-boundary:
    name: Prototype Boundary
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download production build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Enforce prototype diff, import, and artifact boundaries
        env:
          PROTOTYPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROTOTYPE_HEAD_REF: ${{ github.head_ref }}
        run: >-
          node scripts/check-prototype-boundary.mjs
          --base-sha "$PROTOTYPE_BASE_SHA"
          --head-ref "$PROTOTYPE_HEAD_REF"
          --dist dist

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities — review Dependabot alerts"
        continue-on-error: true

  lockfile-check:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Verify lockfile is in sync
        run: npm ci --ignore-scripts
        env:
          npm_config_audit: false

  lighthouse:
    name: Lighthouse CI
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Sentry source map upload (main branch only)
  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.SENTRY_ENABLED == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create Sentry release and upload sourcemaps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          sourcemaps: ./dist/assets
          release: ${{ github.sha }}

  bundle-size:
    name: Bundle Size Check
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Check bundle size with per-chunk breakdown
        run: |
          # Total gzipped JS budget across ALL chunks (including lazy-loaded
          # route chunks, not just initial load). Initial dashboard load is
          # enforced separately by Lighthouse CI. Raised to 1500KB after the
          # student-experience remediation added many new code-split routes
          # (planner, journal, leaderboard, habits, tutor, marketplace, teams)
          # and the live admin/coordinator prototype-parity surfaces. This is
          # an aggregate all-route ceiling, not an initial-load allowance.
          MAX_SIZE_KB=1500
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Raw (KB) | Gzipped (KB) |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|--------------|" >> $GITHUB_STEP_SUMMARY
          TOTAL_GZ=0
          for f in $(find dist/assets -name '*.js' | sort); do
            RAW_KB=$(wc -c < "$f" | awk '{printf "%.1f", $1/1024}')
            GZ_KB=$(gzip -c "$f" | wc -c | awk '{printf "%.1f", $1/1024}')
            GZ_INT=$(gzip -c "$f" | wc -c | awk '{printf "%.0f", $1/1024}')
            TOTAL_GZ=$((TOTAL_GZ + GZ_INT))
            BASENAME=$(basename "$f")
            echo "| $BASENAME | $RAW_KB | $GZ_KB |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total gzipped JS: ${TOTAL_GZ}KB / ${MAX_SIZE_KB}KB budget**" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Total gzipped JS: ${TOTAL_GZ}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$TOTAL_GZ" -gt "$MAX_SIZE_KB" ]; then
            echo "::error::Bundle size ${TOTAL_GZ}KB exceeds budget of ${MAX_SIZE_KB}KB"
            exit 1
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify critical E2E contracts and collection
        run: |
          npm run check:critical-e2e
          npm run check:critical-routes
          npm run check:playwright-contracts
          npx playwright test --list

      - name: Check if Supabase backend is available
        id: backend
        run: |
          if [[ "$VITE_SUPABASE_URL" == "http://localhost:54321" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E tests skipped — set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets to enable"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        if: steps.backend.outputs.available == 'true'
        run: npx playwright test --project=legacy-smoke

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sql-lint:
    name: SQL Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      # Dev dependencies (incl. the `pg` Postgres driver) are needed by the
      # Declared_Object_Check step below once objects are declared in the manifest.
      - run: npm ci

      - name: Validate SQL migration syntax
        run: |
          echo "## SQL Migration Validation" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          for f in $(find supabase/migrations -name '*.sql' 2>/dev/null | sort); do
            # Check for common SQL syntax issues
            if grep -qiP '(CREATE\s+TABEL|DRPO\s+TABLE|ATLER\s+TABLE)' "$f" 2>/dev/null; then
              echo "::error file=$f::Possible SQL typo detected in $f"
              ERRORS=$((ERRORS + 1))
            fi
            # Check file is not empty
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty migration file: $f"
              ERRORS=$((ERRORS + 1))
            fi
            # Check for balanced parentheses
            OPEN=$(grep -o '(' "$f" | wc -l)
            CLOSE=$(grep -o ')' "$f" | wc -l)
            if [ "$OPEN" -ne "$CLOSE" ]; then
              echo "::warning file=$f::Unbalanced parentheses in $f (open: $OPEN, close: $CLOSE)"
            fi
          done
          echo "Checked $(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l) migration files"
          echo "- Checked **$(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l)** migration files" >> $GITHUB_STEP_SUMMARY
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS SQL issues"
            exit 1
          fi
          echo "- **All migrations passed validation**" >> $GITHUB_STEP_SUMMARY

      - name: Replay-order integrity (no too-early function refs — guards Supabase Preview)
        # A migration must never ALTER/REVOKE/GRANT/COMMENT a function (or attach a trigger
        # that EXECUTEs one) before the migration that CREATEs it. Such ordering aborts a
        # fresh replay (Supabase Preview / clean rebuild) with 42883 even though production
        # is fine. This catches that class statically, before the Supabase Preview check.
        run: node scripts/check-migration-replay-order.mjs

      - name: Duplicate migration base-name guard (root-cause guard for regressed re-definitions)
        # A re-used <base-name> means the later file wins on a fresh replay; if it carries an
        # older/less-hardened body it silently regresses the rebuilt DB (root cause of the
        # CLASS A/H search_path regressions). Known/applied duplicates are grandfathered in
        # the script's allowlist; any NEW duplicate base-name fails here.
        run: node scripts/check-migration-duplicate-names.mjs

      - name: Edge Function schema-contract check (Req 19.5 / Req 22)
        # Edge Functions run on Deno and are NOT type-checked by `tsc`, so a query like
        # `.from("assignments").select("clo_ids")` compiles yet fails at runtime when the
        # real column is `clo_weights` (the class that broke the OBE accreditation report
        # and course-file generators). This validates every `.from().select/.eq/...` in
        # supabase/functions/** against src/types/database.ts. Pre-existing drift is
        # grandfathered in scripts/edge-fn-schema-baseline.json; any NEW drift — or a
        # regression of the fixed OBE-export columns — fails the build.
        run: node scripts/check-edge-fn-schema.mjs

      - name: Declared-object existence check (C4 — Req 20, 21.1)
        # Verifies every DB object a completed task declares as created (materialized views,
        # functions, …) actually exists in the target schema — closing the "task checked off
        # before its migration applied" gap. With the current empty manifest this exits 0
        # WITHOUT needing a DB connection. Once Part A/B tasks append their objects to
        # scripts/declared-objects.json it connects via SUPABASE_DB_URL (the Supabase preview
        # branch DB URL, never production) to verify them. The secret is optional today: if it
        # is absent while the manifest is empty the check still passes; if objects are declared
        # but the secret is missing the check fails loudly, demanding the preview URL.
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Declared-object existence check skipped — SUPABASE_DB_URL not configured. Clean migration replay is already verified by the required 'Supabase Preview' check; set SUPABASE_DB_URL (preview branch) to enable direct verification."
            echo "- Declared-object check **skipped** (no SUPABASE_DB_URL); covered by Supabase Preview replay." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          node scripts/check-declared-objects.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  rls-guard:
    name: RLS Multi-Tenant Isolation Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify no cross-institution RLS leaks in migrations
        run: npx vitest --run src/__tests__/properties/rlsInstitutionIsolation.property.test.ts

  preview-validation-relevance:
    name: Preview validation relevance
    # A Git-linked Preview is mandatory evidence for schema-bearing changes, but
    # documentation, dependency, and workflow-only PRs must not create a paid
    # Preview solely to satisfy an irrelevant database integration gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # dorny/paths-filter@v4 requires pull-requests: read to resolve changed
    # paths on pull_request events.
    permissions:
      pull-requests: read
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            required:
              - 'supabase/**'

  runtime-deployment-impact:
    name: Runtime deployment impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deployment_required: ${{ steps.impact.outputs.deployment_required }}
      deployment_closure: ${{ steps.impact.outputs.deployment_closure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate manifest and resolve the PR runtime closure
        id: impact
        run: |
          node scripts/resolve-runtime-deployment-impact.mjs --validate
          node scripts/resolve-runtime-deployment-impact.mjs \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" --format github \
            >> "$GITHUB_OUTPUT"

  rls-smoke:
    name: RLS Smoke (Supabase preview)
    # Part C — C3 RLS_Smoke_Test (Req 19, 21.2). Runs the isolated integration suite
    # (vitest.integration.config.ts) which performs REAL per-role inserts/updates against a
    # Supabase PREVIEW branch — never production (a config-load guard aborts if SUPABASE_URL
    # resolves to the production project ref). For pull requests, credentials are resolved
    # from the isolated Supabase Preview branch using SUPABASE_ACCESS_TOKEN. Missing preview
    # credentials fail this required gate; the RAG authorization suite must never pass by
    # silently skipping its cases.
    needs: [preview-validation-relevance, runtime-deployment-impact]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs['preview-validation-relevance'].outputs.required == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      # Release-critical Preview validation uses the exact CLI recorded in
      # package-lock.json. Latest-at-runtime is not reproducible.
      - run: npm ci

      - name: Wait for isolated Supabase Preview deployment and resolve credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PARENT_PROJECT_REF || 'cdlgtbvxlxjpcddjazzx' }}
          SUPABASE_PREVIEW_BRANCH: ${{ github.head_ref }}
          SUPABASE_PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required to resolve the isolated Preview branch"
            exit 1
          fi

          preview_ref=""
          preview_status=""
          for attempt in $(seq 1 60); do
            if ! branches=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 20 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PARENT_PROJECT_REF/branches"); then
              echo "::warning::Supabase Preview branch lookup attempt $attempt failed; retrying"
              branches='[]'
            fi
            preview=$(jq -c \
              --arg branch "$SUPABASE_PREVIEW_BRANCH" \
              --arg pr "$SUPABASE_PREVIEW_PR_NUMBER" \
              '[.[] | select(.git_branch == $branch and ((.pr_number // "") | tostring) == $pr and .project_ref != null) | {project_ref, status}][0] // {}' \
              <<< "$branches")
            preview_ref=$(jq -r '.project_ref // empty' <<< "$preview")
            preview_status=$(jq -r '.status // empty' <<< "$preview")
            if [[ -n "$preview_ref" && "$preview_status" == "FUNCTIONS_DEPLOYED" ]]; then
              echo "Supabase Preview deployment is complete"
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::Supabase Preview did not reach FUNCTIONS_DEPLOYED: no valid Git-linked branch (git_branch + pr_number); direct MCP branches are invalid PR evidence (last status: ${preview_status:-not-found})"
              exit 1
            fi
            echo "Supabase Preview deployment is not complete on attempt $attempt (status: ${preview_status:-not-found}); retrying"
            sleep 10
          done

          keys=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$preview_ref/api-keys")
          anon_key=$(jq -r '[.[] | select((.name == "publishable" or .type == "publishable") or (.name == "anon" and .type == "legacy")) | .api_key][0] // empty' <<< "$keys")
          service_role_key=$(jq -r '[.[] | select((.name == "secret" or .type == "secret") or (.name == "service_role" and .type == "legacy")) | .api_key][0] // empty' <<< "$keys")
          if [[ -z "$anon_key" || -z "$service_role_key" || "$anon_key" == "null" || "$service_role_key" == "null" ]]; then
            echo "::error::Preview anon/service-role keys could not be resolved"
            exit 1
          fi
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"
          {
            echo "SUPABASE_URL=https://$preview_ref.supabase.co"
            echo "SUPABASE_PREVIEW_REF=$preview_ref"
            echo "SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
            echo "SUPABASE_DB_ENV=preview"
            echo "RLS_SMOKE_REQUIRED=true"
          } >> "$GITHUB_ENV"

      - name: Wait for Preview REST schema readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/institutions?select=join_mode&limit=0" \
              || true)
            if [[ "$status" == "200" || "$status" == "206" ]]; then
              echo "Preview REST schema is ready (institutions.join_mode visible)"
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::Preview REST schema did not expose institutions.join_mode after 30 attempts (last HTTP status: ${status:-none})"
              exit 1
            fi
            echo "Preview REST schema not ready on attempt $attempt (HTTP ${status:-none}); retrying"
            sleep 10
          done

      - name: Deploy exact manifest-derived Edge closure to isolated Preview
        if: needs['runtime-deployment-impact'].outputs.deployment_required == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEPLOYMENT_CLOSURE: ${{ needs['runtime-deployment-impact'].outputs.deployment_closure }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_CLOSURE" || { echo "::error::runtime resolver selected an empty closure"; exit 1; }
          read -r -a closure <<< "$DEPLOYMENT_CLOSURE"
          for function_name in "${closure[@]}"; do
            [[ "$function_name" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::unsafe function slug from resolver"; exit 1; }
          done
          npx supabase functions deploy "${closure[@]}" \
            --project-ref "$SUPABASE_PREVIEW_REF" \
            --use-api --yes

      - name: Run RLS insert/update smoke tests against the preview branch
        run: npm run test:rls

      # Ledger #278 — per-file ran/skipped evidence for this preview-gate run.
      - name: Upload RLS smoke skip-manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rls-smoke-skip-manifest
          path: audit/output/rls-smoke/
          if-no-files-found: warn

      - name: Run HTTP runtime authorization smoke tests against the preview branch
        run: npm run test:preview-runtime-auth
