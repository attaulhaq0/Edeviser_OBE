name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create Release PR or Publish
        # Pinned: v1.9.0 commit (last line supporting Changesets CLI v2, which
        # is what this repo installs: @changesets/cli ^2.31.0). v1 input names
        # are title/commit/publish — the original inputs were correct; only the
        # action tag was wrong (@v2 requires CLI v3).
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore(release): version bump"
          commit: "chore(release): version bump"
          publish: echo "No publish step — update version only"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
