name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create Release PR or Publish
        # Pinned: changesets/action v1.4.10 (commit
        # 06245a4e0a36c064a573d4150030f5ec548e4fcc) — the last v1 line
        # compatible with Changesets CLI v2, which is what this repo installs
        # (@changesets/cli ^2.x). The action's v2+ requires CLI v3 and fails
        # with "use Changesets action v1 instead".
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        with:
          title: "chore(release): version bump"
          commit: "chore(release): version bump"
          publish: echo "No publish step — update version only"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
