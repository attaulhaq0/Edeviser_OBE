name: Deploy Migrations (production)

# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# Database migrations reach production ONLY through this workflow. Previously the
# repo relied on Supabase Branching to auto-apply migrations on merge to `main`,
# but the Branching `main` branch silently entered MIGRATIONS_FAILED and stopped
# applying anything — so merged PRs (e.g. #185/#186) piled up on `main` while
# production's schema_migrations froze weeks behind, with no alert.
#
# This job makes the DB deploy EXPLICIT and LOUD: it runs `supabase db push` on
# every merge to `main` that touches supabase/migrations/**, and fails visibly
# (red X) if a migration cannot apply — instead of drifting silently.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   - SUPABASE_ACCESS_TOKEN   (already present; used by pre-deploy-audit.yml)
#   - SUPABASE_DB_PASSWORD    (ADD THIS — the production DB password)
#
# COMPANION ACTION (dashboard, one-time): set Supabase Branching to PREVIEW-ONLY
# (do not let it auto-apply to production) so this workflow is the single writer
# and the two paths never double-apply on the same merge. Also clear the current
# `main` branch MIGRATIONS_FAILED state once (Dashboard → Branches).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # allow manual re-run

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false # never interrupt a migration mid-apply

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production # optional: gate behind a GitHub environment/approval
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cdlgtbvxlxjpcddjazzx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fail LOUDLY if the DB password secret is missing — the whole point is to
      # never let a deploy silently no-op again.
      - name: Verify deploy credentials are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — cannot deploy migrations."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set — add it in Settings → Secrets → Actions so migrations can be pushed to production."
            exit 1
          fi

      - run: npm ci --ignore-scripts

      # Static replay-order guard before touching production (cheap, catches the
      # 42883 too-early-function-reference class that broke Branching in the first place).
      - name: Migration replay-order integrity check
        run: npm run db:check-replay

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration diff (local vs remote) before applying
        run: supabase migration list --linked || true

      - name: Push migrations to production
        run: supabase db push --linked

      - name: Confirm local head == remote head after push
        run: supabase migration list --linked
