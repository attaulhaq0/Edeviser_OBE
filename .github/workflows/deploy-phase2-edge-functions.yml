name: Deploy Edge Runtime (production)

# MERGE != DEPLOYMENT. This workflow derives the exact Edge closure from the
# reviewed main diff, then pauses at the protected production environment.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-edge-runtime-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve-impact:
    name: Resolve reviewed runtime impact
    runs-on: ubuntu-latest
    outputs:
      deployment_required: ${{ steps.impact.outputs.deployment_required }}
      deployment_closure: ${{ steps.impact.outputs.deployment_closure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate runtime manifest and resolve deployment closure
        id: impact
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/resolve-runtime-deployment-impact.mjs --validate
          # Anchor on the last fully-evaluated main tip (previous successful
          # run's head), not the literal event.before: a cancelled or blocked
          # earlier run never evaluated its diff, and event.before would
          # silently skip those runtime changes forever.
          last_evaluated="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-phase2-edge-functions.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          base_sha="$(node scripts/resolve-production-base-sha.mjs \
            --before "$BEFORE_SHA" --head "$HEAD_SHA" \
            ${last_evaluated:+--last-evaluated-sha "$last_evaluated"})"
          node scripts/resolve-runtime-deployment-impact.mjs \
            --base-sha "$base_sha" --head-sha "$HEAD_SHA" --format github \
            >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy reviewed runtime closure
    needs: resolve-impact
    if: needs['resolve-impact'].outputs.deployment_required == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cdlgtbvxlxjpcddjazzx
      DEPLOYMENT_CLOSURE: ${{ needs['resolve-impact'].outputs.deployment_closure }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured for production"; exit 1; }
          test -n "$DEPLOYMENT_CLOSURE" || { echo "::error::resolver selected an empty deployment closure"; exit 1; }
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Deploy exact manifest-derived closure
        shell: bash
        run: |
          set -euo pipefail
          read -r -a closure <<< "$DEPLOYMENT_CLOSURE"
          for function_name in "${closure[@]}"; do
            [[ "$function_name" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::unsafe function slug from resolver"; exit 1; }
          done
          supabase functions deploy "${closure[@]}" \
            --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Attest deployment and verify ownership/configuration parity
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > deployed-functions.json
          node scripts/download-managed-runtime-source.mjs \
            --project-ref "$SUPABASE_PROJECT_REF" --output-root remote-source
          node scripts/check-edge-function-ownership.mjs --deployed-json deployed-functions.json
          node scripts/attest-edge-deployment.mjs \
            --deployed-json deployed-functions.json \
            --all-managed \
            --reviewed-sha "${{ github.sha }}" \
            --remote-source-root remote-source \
            --expires-after-days 90 \
            --output edge-runtime-attestation.json
      - uses: actions/upload-artifact@v7
        with:
          name: edge-runtime-attestation-snapshot
          path: edge-runtime-attestation.json
          retention-days: 90
